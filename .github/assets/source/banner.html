<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mihirkavi.github.io README banner</title>
<!-- Echoes www.mihirkavishwar.com: Inter 590, Georgia italic cobalt accent; JetBrains Mono for the URLs. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;590;620;750;800&family=JetBrains+Mono:wght@500;600&display=block" rel="stylesheet">
<style>
  :root {
    --canvas: #f5f4ef; --surface: #ffffff; --ink: #15171a; --muted: #5b6067; --line: #d8d7d1; --accent: #2457e6; --faint: #ecebe5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --canvas: #141a24; --surface: #1c2330; --ink: #f5f4ef; --muted: #a9afb8; --line: #313a49; --accent: #7c9cff; --faint: #19202c; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { width: 1600px; height: 520px; overflow: hidden; position: relative; background: var(--canvas); color: var(--ink); font-family: Inter, ui-sans-serif, sans-serif; }
  .copy { position: absolute; left: 110px; top: 80px; width: 720px; }
  .mark { display: flex; align-items: center; gap: 14px; font-size: 22px; font-weight: 750; letter-spacing: -0.025em; }
  .m { width: 40px; height: 40px; border-radius: 9px; background: #2457e6; color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 26px; letter-spacing: -0.04em; }
  .eyebrow { margin: 52px 0 20px; color: var(--accent); font-size: 15px; font-weight: 750; letter-spacing: 0.14em; text-transform: uppercase; }
  h1 { margin: 0; font-size: 86px; line-height: 1; letter-spacing: -0.07em; font-weight: 590; }
  h1 em { color: var(--accent); font-family: Georgia, "Times New Roman", serif; font-size: 0.94em; font-weight: 400; letter-spacing: -0.04em; }
  .lede { margin: 26px 0 0; color: var(--muted); font-size: 23px; line-height: 1.5; }

  /* Signature motif: an old address forwarding to the new one. */
  .routes { position: absolute; left: 900px; top: 140px; width: 600px; display: grid; gap: 22px; }
  .route { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .bar { display: flex; align-items: center; gap: 12px; height: 58px; padding: 0 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 19px; box-shadow: 0 10px 30px rgba(21, 23, 26, 0.06); }
  .bar.old { background: var(--faint); color: var(--muted); box-shadow: none; }
  .bar.old s { text-decoration-color: var(--muted); text-decoration-thickness: 1.5px; }
  .bar .lock { width: 12px; height: 12px; border-radius: 50%; background: var(--line); flex: none; }
  .bar.new .lock { background: var(--accent); }
  .bar b { color: var(--ink); font-weight: 600; }
  .arrow { display: flex; align-items: center; gap: 10px; padding-left: 26px; color: var(--accent); font-size: 14px; font-weight: 750; letter-spacing: 0.12em; text-transform: uppercase; }
  .arrow svg { flex: none; }
  .keep { margin-top: 18px; display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: 17px; }
  .keep code { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 16px; padding: 6px 12px; border: 1px dashed var(--line); border-radius: 10px; color: var(--ink); }
</style>
</head>
<body>
  <div class="copy">
    <div class="mark"><span class="m">M</span>mihirkavi.github.io</div>
    <p class="eyebrow">GitHub Pages · Redirect</p>
    <h1>Old links,<br><em>new home.</em></h1>
    <p class="lede">Every old link forwards to mihirkavishwar.com,<br>path and all.</p>
  </div>

  <div class="routes" aria-hidden="true">
    <div class="route">
      <div class="bar old"><span class="lock"></span><s>mihirkavi.github.io/about</s></div>
      <div class="arrow"><svg width="22" height="34" viewBox="0 0 22 34"><path d="M11 0 V28 M3 20 L11 30 L19 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>404.html forwards the path</div>
      <div class="bar new"><span class="lock"></span><span><b>www.mihirkavishwar.com</b>/about</span></div>
    </div>
    <div class="keep"><code>mihirkavi.github.io/&lt;repo&gt;/</code> project sites stay untouched</div>
  </div>
</body>
</html>
